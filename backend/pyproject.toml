[project]
name = "metric-investigator"
version = "0.1.0"
description = "Metric Investigator - evidence-first business metric investigation agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-postgres>=3.1.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 300
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["migrations/*/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ANN", "BLE", "C4", "SIM"]
ignore = ["ANN401", "S101", "S311", "S608", "B008", "S105", "S106", "SIM102", "SIM113", "SIM117", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "BLE", "B017", "E501"]
"app/reports/export.py" = ["E501"]  # inline HTML template

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["app"]
