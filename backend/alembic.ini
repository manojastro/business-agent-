# Two migration environments:
#   uv run alembic -n app upgrade head         (application DB, as APP_DB_USER)
#   uv run alembic -n analytics upgrade head   (source analytics DB, as ANALYTICS_OWNER_USER)
# Database URLs come from the environment (see app/config.py); none are stored here.

[app]
script_location = %(here)s/migrations/app
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[analytics]
script_location = %(here)s/migrations/analytics
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
